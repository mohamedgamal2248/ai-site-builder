name: Ingest Pi statistics

# Manual backfill / catch-up run. The regular schedule lives in Supabase (pg_cron calls
# /api/cron/ingest every 5 minutes). Needs the repository secret DATABASE_URL set to the
# Supabase transaction pooler URL (port 6543).
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Seconds to run (use up to 18000 for the first lockup backfill)"
        default: "480"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/ingest.ts --schema --budget=${{ github.event.inputs.budget || '480' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
