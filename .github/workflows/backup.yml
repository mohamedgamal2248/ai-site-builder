name: Weekly database backup

# Dumps the Blockchain Pi tables every Sunday and keeps the file as a workflow artifact for
# 30 days (Actions → this workflow → the run → Artifacts). Uses the DATABASE_URL secret.
on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install the PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TABLES="sync_state daily_stats large_payments lockups wallet_flows_daily wallet_balances holders push_subscriptions flows_hourly signals_hourly alerts client_errors"
          ARGS=""; for t in $TABLES; do ARGS="$ARGS -t public.$t"; done
          # pg_dump needs a session connection: use the pooler's session port (5432) instead of 6543.
          URL="${DATABASE_URL/:6543/:5432}"
          /usr/lib/postgresql/17/bin/pg_dump "$URL" --no-owner --no-privileges $ARGS | gzip -9 > blockchain-pi-$(date -u +%F).sql.gz
          ls -lh *.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: "*.sql.gz"
          retention-days: 30
